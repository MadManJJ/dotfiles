# ==========================================
# 1. GENERAL SETTINGS & TERM OVERRIDES
# ==========================================

# Force tmux to use 256 colors and support true color (RGB)
set -g default-terminal "tmux-256color"

# Bulletproof terminal overrides for Kitty and true color support
set -as terminal-features ",xterm-kitty:RGB"
set -ga terminal-overrides ",xterm-256color:Tc"
set -ga terminal-overrides ",xterm-kitty:Tc"

# Reduce Escape time (Essential for Neovim snappiness)
set -s escape-time 10

# Enable mouse support (Resizing panes/scrolling)
set -g mouse on

# Start window/pane indexing at 1 (Matches keyboard row)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

set -s set-clipboard on
set -g allow-passthrough on

# Increase scrollback history
set -g history-limit 1000000

set-option -g allow-rename on
set-option -g automatic-rename on

# Fixed: layers the basename extract (b:) first, then slices it to a max of 10 characters (=10)
set -g @catppuccin_window_text " #{b;=10:pane_current_path}"
set -g @catppuccin_window_default_text " #{b;=10:pane_current_path}"
set -g @catppuccin_window_current_text " #{b;=10:pane_current_path}"

# Force global fallback for older Catppuccin engines
set -ogq @catppuccin_window_text " #{b;=10:pane_current_path}"
set -ogq @catppuccin_window_current_text " #{b;=10:pane_current_path}"

# ==========================================
# 2. KEY BINDINGS (The "Vim-way")
# ==========================================

# Change Prefix to Ctrl-a (Easier than Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Intuitive Split Panes (using | and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane selection (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind c new-window -a -c "#{pane_current_path}"

# ==========================================
# 3. PLUGINS (via TPM)
# ==========================================

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible' 
set -g @plugin 'catppuccin/tmux'

# Load Catppuccin theme
run ~/.tmux/plugins/tmux/catppuccin.tmux

set-option -g status-position top
set -g status-justify left

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Initialize TMUX plugin manager (KEEP THIS AT THE VERY BOTTOM)
run '~/.tmux/plugins/tpm/tpm'
