# ==========================================
# 1. GENERAL SETTINGS
# ==========================================

# Fix colors for Neovim (Crucial!)
set -g default-terminal "screen-256color"
set -as terminal-features ",xterm-256color:RGB"

# Enable mouse support (Resizing panes/scrolling)
set -g mouse on

# Start window/pane indexing at 1 (Matches keyboard row)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Reduce Escape time (Essential for Neovim snappiness)
set -s escape-time 0

# Increase scrollback history
set -g history-limit 1000000

# ==========================================
# 2. KEY BINDINGS (The "Vim-way")
# ==========================================

# Change Prefix to Ctrl-a (Easier than Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Easy config reload
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# Intuitive Split Panes (using | and -)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Vim-style pane selection (Alt + hjkl)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# ==========================================
# 3. PLUGINS (via TPM)
# ==========================================

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect' # Save sessions
set -g @plugin 'tmux-plugins/tmux-continuum' # Auto-save every 15 mins
set -g @plugin 'catppuccin/tmux'

run ~/.tmux/plugins/tmux/catppuccin.tmux

set-option -g status-position top

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_uptime}"

# Plugin Config: Auto-restore sessions on tmux start
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (KEEP THIS AT THE VERY BOTTOM)
run '~/.tmux/plugins/tpm/tpm'
